# SonarQube Cloud *Automatic Analysis* reads this file on every push/PR.
# sonar-project.properties is for CI-based SonarScanner and is not consumed
# by SonarQube Cloud Automatic Analysis.
#
# Keep the source and test trees disjoint; do not scan the entire repository
# as sources (that can misclassify test files and GitHub workflow YAML).
sonar.sources=src/webchallscan
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# Limit semantic checks to the project's tested Python versions.
sonar.python.version=3.10,3.12
